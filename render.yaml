# Full-stack live deploy — same experience as localhost (RTSP + YOLO + UI on one URL)
# Requires payment method on Render (hackathon credits apply). Uses Standard 2GB RAM.
# Deploy: dashboard.render.com → New → Blueprint → patelzarvin/police_kaamkaj

services:
  - type: web
    name: police-kaamkaj
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SERVE_FRONTEND
        value: "true"
      - key: RENDER_DEMO_MODE
        value: "false"
      - key: ENABLE_LIVE_PIPELINE
        value: "true"
      - key: MAX_CONCURRENT_STREAMS
        value: "4"
      - key: PIPELINE_STARTUP_DELAY_SEC
        value: "8"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/sentinel.db
