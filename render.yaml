# Render.com free hosting — no VPS required
# Dashboard: https://dashboard.render.com → New → Blueprint → connect GitHub repo

services:
  - type: web
    name: sentinel-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/sentinel.db
      - key: ENABLE_LIVE_PIPELINE
        value: "false"
      - key: MAX_CONCURRENT_STREAMS
        value: "2"
      - key: PIPELINE_STARTUP_DELAY_SEC
        value: "10"
      - key: PYTHON_VERSION
        value: "3.11.0"

  - type: web
    name: sentinel-dashboard
    runtime: static
    buildCommand: cd frontend && npm install && VITE_API_URL=https://sentinel-api.onrender.com/api npm run build
    staticPublishPath: frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
